<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPL GAME STUDIO — Професійний ремонт консолей та джойстиків</title>
    
    <!-- Поисковые мета-теги (SEO Keywords & Description) -->
    <meta name="description" content="PPL GAME STUDIO (PPL Computer Entertainment Systems) — Професійний ремонт та обслуговування ігрових приставок PlayStation, Xbox, джойстиків DualSense, DualShock, Xbox Controller та комп'ютерної техніки. Від гравця до гравців.">
    <meta name="keywords" content="ремонт playstation, ремонт xbox, ремонт джойстиків, ремонт геймпадів, заміна стіків, усунення дрифту, чистка консолей, заміна термопасти, обслуговування консолей, ремонт ps5, ремонт ps4, ремонт ps3, ремонт ps2, ремонт xbox series x s, ремонт xbox one, ремонт xbox 360, покупка продаж обмін приставок, ремонт пк та ноутбуків, ppl game studio, pplgamestudio">
    <meta name="author" content="PPL GAME STUDIO">

    <!-- Шрифт Montserrat для современного строгого стиля -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #060b16;        /* Глубокий темно-синий фон */
            --bg-sec: #0b1325;         /* Вторичный темно-синий для карточек и секций */
            --bg-card: #101b33;        /* Подсветка блоков */
            --gold: #d4af37;           /* Благородное золото */
            --gold-light: #f3cf65;     /* Светлое золото для градиентов и наведения */
            --gold-border: rgba(212, 175, 55, 0.28);
            --text-white: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .gold-text {
            color: var(--gold);
        }

        /* --- ШАПКА САЙТА (HEADER) --- */
        header {
            background: rgba(6, 11, 22, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--gold-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 84px;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            stroke: var(--gold);
        }

        .logo-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--gold);
            line-height: 1;
        }

        .logo-sub {
            font-size: 10px;
            letter-spacing: 2.5px;
            color: var(--text-white);
            display: block;
            margin-top: 3px;
        }

        .logo-divider {
            height: 32px;
            width: 1px;
            background: var(--gold-border);
        }

        .logo-tagline {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.8px;
            line-height: 1.35;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-links a {
            position: relative;
            padding: 6px 0;
            color: var(--text-white);
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--gold);
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--gold);
        }

        /* Переключатель языков */
        .lang-switch {
            display: flex;
            border: 1px solid var(--gold);
            border-radius: 6px;
            overflow: hidden;
        }

        .lang-btn {
            background: transparent;
            color: var(--text-white);
            border: none;
            padding: 7px 14px;
            font-family: inherit;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: 0.25s;
        }

        .lang-btn.active {
            background: var(--gold);
            color: var(--bg-main);
        }

        /* --- ГЛАВНЫЙ ЭКРАН (HERO) --- */
        .hero {
            position: relative;
            padding: 75px 0 85px;
            background: 
                radial-gradient(circle at 80% 35%, rgba(26, 54, 109, 0.38) 0%, transparent 55%),
                radial-gradient(circle at 20% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 45%),
                linear-gradient(180deg, var(--bg-main) 0%, var(--bg-sec) 100%);
            border-bottom: 1px solid var(--gold-border);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 48px;
            align-items: center;
        }

        .hero-eyebrow {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 14px;
            display: block;
        }

        .hero-title {
            font-size: 48px;
            font-weight: 800;
            line-height: 1.12;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .hero-title span {
            color: var(--gold);
            display: block;
        }

        .hero-platforms {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text-white);
        }

        .hero-platforms .sep {
            color: var(--gold);
        }

        .hero-desc {
            color: var(--text-muted);
            font-size: 16px;
            max-width: 540px;
            margin-bottom: 34px;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 28px;
        }

        .btn-gold-outline {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 30px;
            border: 1.5px solid var(--gold);
            border-radius: 50px;
            color: var(--text-white);
            font-weight: 600;
            font-size: 15px;
            background: rgba(212, 175, 55, 0.08);
        }

        .btn-gold-outline:hover {
            background: var(--gold);
            color: var(--bg-main);
            transform: translateY(-2px);
        }

        .quick-contacts {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }

        .contact-pill {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .contact-pill svg {
            width: 26px;
            height: 26px;
            stroke: var(--gold);
            flex-shrink: 0;
        }

        .contact-pill-text {
            font-size: 12px;
            line-height: 1.35;
        }

        .contact-pill-text strong {
            display: block;
            color: var(--text-white);
            font-size: 13px;
        }

        .contact-pill-text span {
            color: var(--text-muted);
        }

        /* Правая карточка с концептом визитки */
        .visiting-card {
            background: linear-gradient(145deg, rgba(16, 27, 51, 0.9), rgba(8, 14, 28, 0.95));
            border: 1px solid var(--gold-border);
            border-radius: 16px;
            padding: 34px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .visiting-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 30px;
            right: 30px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .vc-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 18px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .vc-system-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .vc-motto {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-white);
            margin-top: 4px;
        }

        .vc-neon {
            font-family: 'Caveat', cursive;
            color: var(--gold-light);
            font-size: 22px;
            line-height: 0.95;
            text-align: right;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.45);
            transform: rotate(-4deg);
        }

        .vc-quote {
            font-style: italic;
            color: var(--gold-light);
            font-size: 14px;
            margin-bottom: 18px;
            padding-left: 12px;
            border-left: 2px solid var(--gold);
        }

        .vc-list {
            list-style: none;
            display: grid;
            gap: 10px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .vc-list li {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .vc-list li::before {
            content: '◆';
            color: var(--gold);
            font-size: 10px;
        }

        /* --- СЕКЦИЯ УСЛУГ (5 колонок с упором на ремонт) --- */
        .services-bar {
            background: var(--bg-main);
            border-bottom: 1px solid var(--gold-border);
            padding: 46px 0;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }

        .service-item {
            text-align: center;
            padding: 14px 16px;
            border-right: 1px solid rgba(255, 255, 255, 0.07);
            transition: transform 0.25s ease;
        }

        .service-item:last-child {
            border-right: none;
        }

        .service-item:hover {
            transform: translateY(-4px);
        }

        .service-icon {
            width: 42px;
            height: 42px;
            stroke: var(--gold);
            margin: 0 auto 14px;
            display: block;
        }

        .service-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-white);
        }

        .service-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.45;
        }

        /* --- ИГРОВЫЕ ПЛАТФОРМЫ --- */
        .platforms-sec {
            padding: 56px 0;
            background: var(--bg-sec);
            border-bottom: 1px solid var(--gold-border);
        }

        .sec-head {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 34px;
        }

        .sec-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--gold);
            white-space: nowrap;
        }

        .sec-line {
            flex-grow: 1;
            height: 1px;
            background: var(--gold-border);
        }

        .sec-tag {
            font-size: 13px;
            color: var(--gold);
            white-space: nowrap;
        }

        .platforms-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
        }

        .platform-box {
            background: rgba(6, 11, 22, 0.65);
            border: 1px solid rgba(212, 175, 55, 0.16);
            border-radius: 10px;
            padding: 18px 8px;
            text-align: center;
            transition: 0.25s;
        }

        .platform-box:hover {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.08);
            transform: translateY(-3px);
        }

        .platform-logo {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-white);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .platform-logo span {
            color: var(--gold);
        }

        .platform-name {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* --- О СЕРВИСЕ И КОНТАКТЫ --- */
        .trust-sec {
            padding: 68px 0;
            background: var(--bg-main);
            border-bottom: 1px solid var(--gold-border);
        }

        .trust-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 48px;
            align-items: center;
        }

        .trust-box {
            padding-left: 24px;
            border-left: 3px solid var(--gold);
        }

        .trust-eyebrow {
            font-size: 12px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .trust-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 16px;
            line-height: 1.25;
            text-transform: uppercase;
        }

        .trust-text {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 24px;
        }

        .features-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .feature-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
        }

        .feature-row svg {
            width: 22px;
            height: 22px;
            stroke: var(--gold);
            flex-shrink: 0;
        }

        /* Карточка прямых контактов */
        .contact-card {
            background: var(--bg-sec);
            border: 1px solid var(--gold);
            border-radius: 14px;
            padding: 32px;
            text-align: center;
        }

        .contact-card-title {
            font-size: 14px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .contact-note {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .phone-big {
            font-size: 26px;
            font-weight: 800;
            color: var(--gold);
            display: block;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .email-link {
            display: inline-block;
            font-size: 15px;
            color: var(--text-white);
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--gold-border);
            border-radius: 8px;
        }

        .email-link:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* --- ПОДВАЛ И ПОИСКОВЫЕ КЛЮЧИ (FOOTER) --- */
        footer {
            background: #04070f;
            padding: 40px 0;
            font-size: 13px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 0.7fr 1.6fr 0.7fr;
            gap: 24px;
            align-items: center;
        }

        .seo-keywords-box {
            display: flex;
             gap: 12px;
            align-items: flex-start;
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }

        .seo-keywords-box svg {
            width: 18px;
            height: 18px;
            stroke: var(--gold);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .footer-right {
            text-align: right;
        }

        .footer-brand {
            font-weight: 700;
            color: var(--gold);
            font-size: 15px;
            letter-spacing: 1px;
        }

        .footer-motto {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* --- АДАПТИВНОСТЬ ДЛЯ ТЕЛЕФОНОВ И ПЛАНШЕТОВ --- */
        @media (max-width: 1024px) {
            .hero-grid, .trust-grid {
                grid-template-columns: 1fr;
            }
            .services-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .platforms-grid {
                grid-template-columns: repeat(5, 1fr);
            }
            .footer-grid {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .footer-right {
                text-align: center;
            }
            .seo-keywords-box {
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .nav-links, .logo-divider, .logo-tagline {
                display: none;
            }
            .hero-title {
                font-size: 34px;
            }
            .services-grid {
                grid-template-columns: 1fr 1fr;
            }
            .service-item {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            }
            .platforms-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .features-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ШАПКА САЙТА -->
    <header>
        <div class="container header-inner">
            <a href="#" class="logo-group">
                <div class="logo-brand">
                    <!-- Иконка геймпада -->
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="6" y1="12" x2="10" y2="12"></line>
                        <line x1="8" y1="10" x2="8" y2="14"></line>
                        <line x1="15" y1="13" x2="15.01" y2="13"></line>
                        <line x1="18" y1="11" x2="18.01" y2="11"></line>
                        <rect x="2" y="6" width="20" height="12" rx="6"></rect>
                    </svg>
                    <div>
                        <span class="logo-title">PPL</span>
                        <span class="logo-sub">GAME STUDIO</span>
                    </div>
                </div>
                <div class="logo-divider"></div>
                <div class="logo-tagline">
                    CONSOLE REPAIR<br>SERVICE & ACCESSORIES
                </div>
            </a>

            <nav class="n
